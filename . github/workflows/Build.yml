name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: Expand-Archive p.zip -DestinationPath p -Force
      - shell: pwsh
        run: |
          $f=dir p -Recurse -Filter *.txt | select -First 1
          cd $f.DirectoryName
          cmake -B b
          cmake --build b --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: VST3
          path: "**/*.vst3"
