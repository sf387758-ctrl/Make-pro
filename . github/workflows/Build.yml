name: Build VST3
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        shell: pwsh
        run: |
          Expand-Archive -Path "BM800ToPro_VST3_JUCE_Project.zip" -DestinationPath ./src -Force
      - name: Build
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path ./src -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          Set-Location $f.DirectoryName
          cmake -B build
          cmake --build build --config Release
      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: BM800-Pro-VST3-Ready
          path: |
            **/*.vst3
            **/Release/*.dll
