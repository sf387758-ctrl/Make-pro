name: Build VST3
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        shell: pwsh
        run: |
          Expand-Archive -Path "BM800ToPro_VST3_JUCE_Project.zip" -DestinationPath ./build_src -Force
          Get-ChildItem -Recurse
      - name: Configure
        working-directory: ./build_src
        shell: pwsh
        run: |
          $cmakeFile = Get-ChildItem -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          $dir = $cmakeFile.DirectoryName
          Set-Location $dir
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BM800-Pro-VST3
          path: |
            **/*.vst3
            **/*.dll
