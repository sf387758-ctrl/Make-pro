name: Build VST3
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        shell: pwsh
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath p -Force
      - name: FIX JUCE API
        shell: pwsh
        run: |
          $file = "p/BM800ToPro_VST3/Source/PluginProcessor.cpp"
          (Get-Content $file) -replace 'setAttackTime','setAttack' -replace 'setReleaseTime','setRelease' -replace 'setHoldTime','setHold' | Set-Content $file
      - name: Configure
        shell: pwsh
        run: |
          $f = Get-ChildItem p -Recurse -Filter CMakeLists.txt | Where-Object { $_.FullName -like "*BM800*" } | Select-Object -First 1
          cmake -S $f.DirectoryName -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BM800ToPro_VST3
          path: build/**/*.vst3
