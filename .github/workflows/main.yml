name: Build VST3
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip
        shell: pwsh
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath p -Force

      - name: FORCE JUCE 7.0.12 - FIX ALL 16 ERRORS
        shell: pwsh
        run: |
          $cmake = Get-ChildItem p -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          Write-Host "Found: $($cmake.FullName)"
          $txt = Get-Content $cmake.FullName -Raw
          $txt = $txt -replace 'GIT_TAG\s+.*', 'GIT_TAG 7.0.12'
          $txt | Set-Content $cmake.FullName
          Write-Host "--- FIXED CMAKE ---"
          Get-Content $cmake.FullName | Select-String -Pattern "GIT_TAG" -Context 1,1

      - name: Configure
        shell: pwsh
        run: |
          $f = Get-ChildItem p -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          cmake -S $f.DirectoryName -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BM800ToPro_VST3
          path: build/**/*.vst3
